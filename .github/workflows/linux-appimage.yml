name: Linux AppImage

on:
  push:
    branches:
      - main
      - 'ci/**'
    paths:
      - '.github/workflows/linux-appimage.yml'
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/build-scripts/**'
      - 'Tools/dora-rust/**'
      - 'Tools/dora-dora/**'
      - 'Tools/dora-wa/**'
      - 'Assets/**'
      - 'Projects/Linux/**'
      - 'packaging/appimage/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/linux-appimage.yml'
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/build-scripts/**'
      - 'Tools/dora-rust/**'
      - 'Tools/dora-dora/**'
      - 'Tools/dora-wa/**'
      - 'Assets/**'
      - 'Projects/Linux/**'
      - 'packaging/appimage/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-assets:
    name: Build shared Web IDE assets
    if: >-
      (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/')) &&
      (github.event_name != 'push' ||
        (!contains(github.event.head_commit.message, '[skip CI]') &&
         !contains(github.event.head_commit.message, '[skip Linux]')))
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.5
          actions-cache-folder: emsdk-cache

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: Tools/dora-dora/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
          cache-dependency-path: Tools/dora-dora/pnpm-lock.yaml

      - name: Setup CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install 'cmake==3.30.5'
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Verify Web build tools
        run: bash Tools/build-scripts/check_web_build_env.sh

      - name: Build and verify Web IDE
        working-directory: Tools/dora-dora
        run: |
          pnpm install --frozen-lockfile
          pnpm test:web-runtime-preparation
          pnpm build
          pnpm test:web-package
          pnpm verify:web-release-assets

      - name: Upload shared Web IDE assets
        uses: actions/upload-artifact@v4
        with:
          name: web-ide-assets-${{ github.sha }}
          path: Assets/www
          if-no-files-found: error
          retention-days: 3

  build:
    needs: web-assets
    if: >-
      always() &&
      (github.event_name != 'push' ||
        (!contains(github.event.head_commit.message, '[skip CI]') &&
         !contains(github.event.head_commit.message, '[skip Linux]'))) &&
      ((github.ref == 'refs/heads/main' && needs.web-assets.result == 'skipped') ||
       ((github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/')) &&
        needs.web-assets.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download shared Web IDE assets
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/')
        uses: actions/download-artifact@v5
        with:
          name: web-ide-assets-${{ github.sha }}
          path: Assets/www

      - name: Verify shared Web IDE assets
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/')
        run: node Tools/dora-dora/scripts/verify-web-release-assets.mjs Assets/www

      - name: Install dependencies
        run: |
          shopt -s nullglob
          for chrome_source in /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources; do
            sudo mv "$chrome_source" "$chrome_source.disabled"
          done
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config patchelf pax-utils curl \
            libgl1-mesa-dev libssl-dev libdbus-1-dev libasound2-dev \
            libjack-jackd2-dev libpulse-dev libpipewire-0.3-dev \
            libsamplerate0-dev libsndio-dev libibus-1.0-dev libudev-dev \
            libusb-1.0-0-dev libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxrandr-dev libxrender-dev libxss-dev libdrm-dev \
            libgbm-dev libegl1-mesa-dev libwayland-dev libwayland-bin \
            wayland-protocols libxkbcommon-dev libdecor-0-dev lua5.1 luarocks
          sudo luarocks install luafilesystem

      - name: Generate Lua bindings
        run: |
          cd Tools/tolua++
          lua tolua++.lua

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - uses: dtolnay/rust-toolchain@stable

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build Linux debug
        if: github.ref == 'refs/heads/main'
        run: Tools/build-scripts/build_linux.sh debug

      - name: Build Linux release
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/')
        run: Tools/build-scripts/build_linux.sh release

      - name: Package AppImage
        id: package
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/')
        env:
          APPIMAGE_ARCH: ${{ matrix.arch }}
        run: |
          filename="dora-ssr-linux-${APPIMAGE_ARCH}.AppImage"
          Tools/build-scripts/package_appimage.sh "$GITHUB_WORKSPACE/$filename"
          echo "path=$filename" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/')
        uses: actions/upload-artifact@v4
        with:
          name: dora-ssr-linux-appimage-${{ matrix.arch }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
