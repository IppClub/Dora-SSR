name: Linux

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/linux.yml'
      # Shared engine code — triggers all platforms
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/dora-rust/**'
      - 'Tools/dora-wa/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
      # Platform-specific code
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/linux.yml'
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/dora-rust/**'
      - 'Tools/dora-wa/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip CI]') && !contains(github.event.head_commit.message, '[skip Linux]')"
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install deps
      run: |
        shopt -s nullglob
        for chrome_source in /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources; do
          sudo mv "$chrome_source" "$chrome_source.disabled"
        done
        sudo apt-get update
        sudo apt-get install -y pkg-config libgl1-mesa-dev libssl-dev libdbus-1-dev \
          libasound2-dev libjack-jackd2-dev libpulse-dev libpipewire-0.3-dev libsamplerate0-dev libsndio-dev \
          libibus-1.0-dev libudev-dev libusb-1.0-0-dev \
          libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxrender-dev libxss-dev \
          libdrm-dev libgbm-dev libegl1-mesa-dev libwayland-dev libwayland-bin wayland-protocols \
          libxkbcommon-dev libdecor-0-dev
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
    - name: Record xmake version
      run: xmake --version
    - name: Build Linux debug
      run: |
        xmake f -y -p linux -a x86_64 -m debug
        xmake build Dora
