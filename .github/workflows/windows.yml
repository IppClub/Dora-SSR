name: Windows

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/windows.yml'
      # Shared engine code — triggers all platforms
      - 'Source/**'
      - 'Tools/Godot/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/dora-rust/**'
      - 'Tools/dora-wa/**'
      - 'Assets/**'
      # Platform-specific code
      - 'Projects/Windows/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/windows.yml'
      - 'Source/**'
      - 'Tools/Godot/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/dora-rust/**'
      - 'Tools/dora-wa/**'
      - 'Assets/**'
      - 'Projects/Windows/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026    
    if: "!contains(github.event.head_commit.message, '[skip CI]') && !contains(github.event.head_commit.message, '[skip Windows]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc
      - name: Setup MinGW64 for Go cgo
        shell: msys2 {0}
        run: |
          mingw64_bin="$(cygpath -w /mingw64/bin)"
          mingw64_gcc="$(cygpath -w /mingw64/bin/gcc.exe)"
          if [ ! -x /mingw64/bin/gcc.exe ]; then
            find / -path '*/gcc.exe' -print
            echo "MINGW64 gcc was not installed" >&2
            exit 1
          fi
          echo "Using MinGW64 gcc: ${mingw64_gcc}"
          echo "${mingw64_bin}" >> "${GITHUB_PATH}"
          echo "CC=${mingw64_gcc}" >> "${GITHUB_ENV}"
      - name: Record xmake version
        run: xmake --version
      - name: Windows build
        run: |
          Remove-Item Env:MSYSTEM -ErrorAction SilentlyContinue
          xmake f -y -p windows -a x64 -m debug
          xmake build Dora
