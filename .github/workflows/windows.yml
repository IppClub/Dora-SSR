name: Windows

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/windows.yml'
      # Shared engine code — triggers all platforms
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/dora-rust/**'
      - 'Tools/dora-wa/**'
      - 'Assets/**'
      # Platform-specific code
      - 'Projects/Windows/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/windows.yml'
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/dora-rust/**'
      - 'Tools/dora-wa/**'
      - 'Assets/**'
      - 'Projects/Windows/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026    
    if: "!contains(github.event.head_commit.message, '[skip CI]') && !contains(github.event.head_commit.message, '[skip Windows]')"
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          path-type: inherit
          install: mingw-w64-i686-gcc
      - name: Setup MinGW32 for Go cgo
        shell: msys2 {0}
        run: |
          mingw32_bin="$(cygpath -w /mingw32/bin)"
          mingw32_gcc="$(cygpath -w /mingw32/bin/gcc.exe)"
          if [ ! -x /mingw32/bin/gcc.exe ]; then
            find / -path '*/gcc.exe' -print
            echo "MINGW32 gcc was not installed" >&2
            exit 1
          fi
          echo "Using MinGW32 gcc: ${mingw32_gcc}"
          echo "${mingw32_bin}" >> "${GITHUB_PATH}"
          echo "CC=${mingw32_gcc}" >> "${GITHUB_ENV}"
      - name: Record xmake version
        run: xmake --version
      - name: Check touch input sources
        run: xmake dora-test --case=check_touch_input_sources
      - name: Windows build
        run: |
          Remove-Item Env:MSYSTEM -ErrorAction SilentlyContinue
          xmake f -y -p windows -a x86 -m debug
          xmake build Dora
