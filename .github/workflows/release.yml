name: Release

on:
  push:
    tags: 'v*.*.*'
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Validate only Windows packages without publishing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-assets:
    name: Build Web IDE assets
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve and validate release version
        id: version
        run: |
          python3 - <<'PYVERSION'
          import os, re
          from pathlib import Path
          version = 'v' + re.search(r'#define DORA_VERSION "([0-9.]+)"', Path('Source/Basic/Application.cpp').read_text()).group(1)
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == version, 'Tag and engine version differ'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('version=' + version + '\n')
          PYVERSION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: Tools/dora-dora/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
          cache-dependency-path: Tools/dora-dora/pnpm-lock.yaml


      - name: Resolve Dora-Example tests once
        run: xmake dora-test-deps --env-file="$GITHUB_ENV"
      - name: Build and verify Web IDE
        working-directory: Tools/dora-dora
        run: |
          pnpm install --frozen-lockfile
          pnpm test:web-runtime-preparation
          pnpm build
          pnpm test:web-package
          pnpm verify:web-release-assets

      - name: Package standalone Web IDE
        run: |
          cd Assets/www
          zip -qry "$GITHUB_WORKSPACE/web-ide-files.zip" .

      - name: Upload shared Web IDE assets
        uses: actions/upload-artifact@v4
        with:
          name: web-ide-assets-${{ github.sha }}
          path: Assets/www
          if-no-files-found: error
          retention-days: 3

      - name: Upload standalone Web IDE package
        uses: actions/upload-artifact@v4
        with:
          name: release-web-ide
          path: web-ide-files.zip
          if-no-files-found: error
          retention-days: 3

  macos:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_only
    name: Build macOS release
    needs: web-assets
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Download shared Web IDE assets
        uses: actions/download-artifact@v5
        with:
          name: web-ide-assets-${{ github.sha }}
          path: Assets/www

      - name: Verify shared Web IDE assets
        run: node Tools/dora-dora/scripts/verify-web-release-assets.mjs Assets/www

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest


      - name: Generate tutorial docs
        run: node Docs/scripts/generate-language-docs.js

      - name: Build and package macOS
        run: |
          cp Tools/dora-wa/wa.mod Assets/dora-wa
          cp -r Tools/dora-wa/vendor Assets/dora-wa
          xmake dora-package --platform=macosx --mode=release
          cp build/package/macosx/arm64/release/dora-ssr-macos-arm64.zip "$GITHUB_WORKSPACE/dora-ssr-${{ needs.web-assets.outputs.version }}-macos-arm64.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dora-ssr-${{ needs.web-assets.outputs.version }}-macos-arm64.zip
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows release (${{ matrix.backend }})
    needs: web-assets
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        backend: [d3d12, wgl]
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Download shared Web IDE assets
        uses: actions/download-artifact@v5
        with:
          name: web-ide-assets-${{ github.sha }}
          path: Assets/www

      - name: Verify shared Web IDE assets
        run: node Tools/dora-dora/scripts/verify-web-release-assets.mjs Assets/www

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Setup MinGW64 for Go cgo
        shell: msys2 {0}
        run: |
          mingw64_bin="$(cygpath -w /mingw64/bin)"
          mingw64_gcc="$(cygpath -w /mingw64/bin/gcc.exe)"
          test -x /mingw64/bin/gcc.exe
          echo "${mingw64_bin}" >> "${GITHUB_PATH}"
          echo "CC=${mingw64_gcc}" >> "${GITHUB_ENV}"

      - name: Record xmake version
        run: xmake --version

      - name: Generate tutorial docs
        run: node Docs/scripts/generate-language-docs.js

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned MSI tools
        run: |
          dotnet tool install wix --tool-path "$env:RUNNER_TEMP/wix" --version 5.0.2
          "$env:RUNNER_TEMP/wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP/wix/wix.exe" extension add -g WixToolset.UI.wixext/5.0.2
      - name: Package Windows ZIP and MSI
        run: |
          Remove-Item Env:MSYSTEM -ErrorAction SilentlyContinue
          xmake dora-package --platform=windows --arch=x64 --mode=release --windows-backend=${{ matrix.backend }} --format=both
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.backend }}
          path: |
            build/package/windows/x64/release/${{ matrix.backend }}/*.zip
            build/package/windows/x64/release/${{ matrix.backend }}/*.msi
          if-no-files-found: error
          retention-days: 3
      - name: Retain failed Windows build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-failure-${{ matrix.backend }}
          path: |
            build/godot-component/windows/**/build.log
            build/package/windows/**/installer/*.wxs
          if-no-files-found: ignore


  android:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_only
    name: Build Android release
    needs: web-assets
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download shared Web IDE assets
        uses: actions/download-artifact@v5
        with:
          name: web-ide-assets-${{ github.sha }}
          path: Assets/www

      - name: Verify shared Web IDE assets
        run: node Tools/dora-dora/scripts/verify-web-release-assets.mjs Assets/www

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android native toolchain
        run: sdkmanager --install 'ndk;28.1.13356709' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'

      - name: Record xmake version
        run: xmake --version

      - name: Generate tutorial docs
        run: node Docs/scripts/generate-language-docs.js

      - name: Package Android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/signing-key.jks"
          DORA_ANDROID_SIGNING_STORE_FILE="$GITHUB_WORKSPACE/signing-key.jks" \
          DORA_ANDROID_SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
          DORA_ANDROID_SIGNING_KEY_ALIAS="$KEY_ALIAS" \
          DORA_ANDROID_SIGNING_KEY_PASSWORD="$KEY_PASSWORD" \
            xmake dora-package --platform=android --mode=release
          cd Projects/Android/Dora/app/build/outputs/apk/release
          mv app-release.apk dora-ssr-${{ needs.web-assets.outputs.version }}-android.apk
          unzip -l dora-ssr-${{ needs.web-assets.outputs.version }}-android.apk | grep -F 'assets/www/web-player/runtime.json'
          zip -q dora-ssr-${{ needs.web-assets.outputs.version }}-android.zip dora-ssr-${{ needs.web-assets.outputs.version }}-android.apk
          mv dora-ssr-${{ needs.web-assets.outputs.version }}-android.zip "$GITHUB_WORKSPACE/dora-ssr-${{ needs.web-assets.outputs.version }}-android.zip"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dora-ssr-${{ needs.web-assets.outputs.version }}-android.zip
          if-no-files-found: error
          retention-days: 3

  linux:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_only
    name: Build Linux release (${{ matrix.arch }})
    needs: web-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            xmake_arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            xmake_arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download shared Web IDE assets
        uses: actions/download-artifact@v5
        with:
          name: web-ide-assets-${{ github.sha }}
          path: Assets/www

      - name: Verify shared Web IDE assets
        run: node Tools/dora-dora/scripts/verify-web-release-assets.mjs Assets/www

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config patchelf pax-utils curl \
            libgl1-mesa-dev libssl-dev libdbus-1-dev libasound2-dev \
            libjack-jackd2-dev libpulse-dev libpipewire-0.3-dev \
            libsamplerate0-dev libsndio-dev libibus-1.0-dev libudev-dev \
            libusb-1.0-0-dev libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxrandr-dev libxrender-dev libxss-dev libdrm-dev \
            libgbm-dev libegl1-mesa-dev libwayland-dev libwayland-bin \
            wayland-protocols libxkbcommon-dev libdecor-0-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Record xmake version
        run: xmake --version

      - name: Generate tutorial docs
        run: node Docs/scripts/generate-language-docs.js

      - name: Package AppImage
        env:
          APPIMAGE_ARCH: ${{ matrix.arch }}
          XMAKE_ARCH: ${{ matrix.xmake_arch }}
        run: |
          xmake dora-package --platform=linux --arch="$XMAKE_ARCH" --mode=release
          cp "build/package/linux/$XMAKE_ARCH/release/dora-ssr-linux-${APPIMAGE_ARCH}.AppImage" \
            "$GITHUB_WORKSPACE/dora-ssr-${{ needs.web-assets.outputs.version }}-linux-${APPIMAGE_ARCH}.AppImage"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dora-ssr-${{ needs.web-assets.outputs.version }}-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 3

  windows-installers:
    name: Verify Windows install upgrade switch and uninstall
    needs: [web-assets, windows]
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Resolve installer tests
        run: xmake dora-test-deps --env-file="$env:GITHUB_ENV"
      - uses: actions/download-artifact@v5
        with:
          pattern: release-windows-*
          path: windows-packages
          merge-multiple: true
      - name: Verify both installers and ZIP contents
        run: |
          & "$env:DORA_TEST_REPO/Test/Godot/tests/verify_windows_installers.ps1" -Packages "$PWD/windows-packages" -Version '${{ needs.web-assets.outputs.version }}' -EngineRoot $PWD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-validation
          path: windows-packages/*.log
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    needs: [web-assets, macos, windows, windows-installers, android, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release package set
        run: |
          test -s release-assets/web-ide-files.zip
          test -s release-assets/dora-ssr-${{ needs.web-assets.outputs.version }}-macos-arm64.zip
          test -s release-assets/dora-ssr-${{ needs.web-assets.outputs.version }}-windows-x64.zip
          test -s release-assets/dora-ssr-${{ needs.web-assets.outputs.version }}-windows-x64-opengl.zip
          test -s release-assets/dora-ssr-${{ needs.web-assets.outputs.version }}-windows-x64.msi
          test -s release-assets/dora-ssr-${{ needs.web-assets.outputs.version }}-windows-x64-opengl.msi
          test -s release-assets/dora-ssr-${{ needs.web-assets.outputs.version }}-android.zip
          test -s release-assets/dora-ssr-${{ needs.web-assets.outputs.version }}-linux-x86_64.AppImage
          test -s release-assets/dora-ssr-${{ needs.web-assets.outputs.version }}-linux-aarch64.AppImage
          sha256sum release-assets/* > release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS

      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN"

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.web-assets.outputs.version }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: IppClub/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        env:
          DORA_VERSION: ${{ needs.web-assets.outputs.version }}
          HOMEBREW_PACKAGE: release-assets/dora-ssr-${{ needs.web-assets.outputs.version }}-macos-arm64.zip
        run: |
          set -euo pipefail
          version="${DORA_VERSION#v}"
          sha256="$(sha256sum "$HOMEBREW_PACKAGE" | awk '{print $1}')"
          cask="homebrew-tap/Casks/dora-ssr.rb"
          DORA_VERSION="$version" DORA_SHA256="$sha256" ruby -0pi -e 'version = ENV.fetch("DORA_VERSION"); sha256 = ENV.fetch("DORA_SHA256"); gsub(/version "[^"]+"/, "version \"#{version}\""); gsub(/macos-universal\.zip/, "macos-arm64.zip"); gsub(/depends_on :macos(?:\n  depends_on arch: :arm64)?/, "depends_on :macos\n  depends_on arch: :arm64"); gsub(/sha256 "[a-fA-F0-9]+"/, "sha256 \"#{sha256}\"")' "$cask"
          if git -C homebrew-tap diff --quiet -- Casks/dora-ssr.rb; then
            exit 0
          fi
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/dora-ssr.rb
          git -C homebrew-tap commit -m "Update Dora SSR to ${DORA_VERSION}"
          git -C homebrew-tap push
