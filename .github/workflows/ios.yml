name: iOS

on:
  push:
    branches: [ main ]
    paths:
      # Shared engine code — triggers all platforms
      - 'Source/**'
      - 'Tools/Godot/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/dora-rust/**'
      # Platform-specific code
      - 'Projects/iOS/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/**'
      - 'Tools/Godot/**'
      - 'Tools/tolua\+\+/**'
      - 'Tools/dora-rust/**'
      - 'Projects/iOS/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        device: [simulator, device]
        mode: [debug, release]
    runs-on: macos-15
    if: "!contains(github.event.head_commit.message, '[skip CI]') && !contains(github.event.head_commit.message, '[skip iOS]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: iOS build
        run: |
          xmake --version
          xmake app-package --platform=ios --appledev=${{ matrix.device }} --mode=${{ matrix.mode }}

      - name: Retain failed Godot component build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-godot-${{ matrix.device }}-${{ matrix.mode }}-failure
          path: |
            build/godot-component/ios/**/build.log
            build/godot-component/ios/**/link.log
          if-no-files-found: warn
