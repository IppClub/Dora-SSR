name: Web

on:
  push:
    branches: [ main ]
    paths:
      - 'Assets/Script/Lib/**'
      - 'Projects/Web/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Assets/Script/Lib/**'
      - 'Projects/Web/**'
      - 'xmake.lua'
      - 'Projects/xmake/**'
      - 'Source/**'
      - 'Tools/tolua\+\+/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  build-web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Build Web packages
        run: xmake dora-web --tests
      - name: Verify Web package
        run: xmake dora-test --case=check_web_output -- result/dora-web-build-probe
      - name: Verify Web Player package
        run: |
          xmake dora-test --case=check_web_builtin_libraries.test
          xmake dora-test --case=check_web_loader
          xmake dora-test --case=check_web_love_capabilities
          xmake dora-test --case=check_web_package
          xmake dora-test --case=check_web_player_output -- result/dora-web-player
          xmake dora-test --case=check_web_forbidden_deps -- result/dora-web-player
      - name: Package deployable Web Player preview
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        run: |
          xmake dora-test --case=check_web_preview -- result/dora-web-player
          xmake dora-web-preview -- result/dora-web-player result/dora-web-preview "$GITHUB_SHA"
      - name: Upload Web package
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-build-probe
          path: result/dora-web-build-probe
      - name: Upload Web Player package
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-player
          path: result/dora-web-player
      - name: Upload deployable Web Player preview
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-preview
          path: result/dora-web-preview
  build-love-pthread-player:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Build Love pthread Player
        env:
          DORA_WEB_PTHREADS: 1
        run: xmake dora-web --tests
      - name: Verify Love pthread Player
        run: xmake dora-test --case=check_web_love_player_output -- result/love-pthread-player
      - name: Upload Love pthread Player
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: love-pthread-player
          path: result/love-pthread-player
