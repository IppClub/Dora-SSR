name: Web

on:
  push:
    branches: [ main ]
    tags: 'v*.*.*'
    paths:
      - 'Projects/CMake/**'
      - 'Projects/Web/**'
      - 'Source/**'
      - 'Tools/build-scripts/build_web.sh'
      - 'Tools/build-scripts/check_web_build_env.sh'
      - 'Tools/build-scripts/check_web_output.mjs'
      - 'Tools/build-scripts/check_web_player_output.mjs'
      - 'Tools/build-scripts/check_web_forbidden_deps.mjs'
      - 'Tools/build-scripts/check_web_loader.mjs'
      - 'Tools/build-scripts/check_web_love_capabilities.mjs'
      - 'Tools/build-scripts/check_web_love_complex_input.mjs'
      - 'Tools/build-scripts/check_web_love_complex.mjs'
      - 'Tools/build-scripts/stage_web_love_complex_input.mjs'
      - 'Tools/build-scripts/check_web_love_player_output.mjs'
      - 'Tools/build-scripts/check_web_package.mjs'
      - 'Tools/build-scripts/check_web_preview.mjs'
      - 'Tools/build-scripts/package_web_game.mjs'
      - 'Tools/build-scripts/package_web_preview.mjs'
      - 'Tools/build-scripts/rollback_web_preview.mjs'
      - 'Tools/tolua\+\+/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Projects/CMake/**'
      - 'Projects/Web/**'
      - 'Source/**'
      - 'Tools/build-scripts/build_web.sh'
      - 'Tools/build-scripts/check_web_build_env.sh'
      - 'Tools/build-scripts/check_web_output.mjs'
      - 'Tools/build-scripts/check_web_player_output.mjs'
      - 'Tools/build-scripts/check_web_forbidden_deps.mjs'
      - 'Tools/build-scripts/check_web_loader.mjs'
      - 'Tools/build-scripts/check_web_love_capabilities.mjs'
      - 'Tools/build-scripts/check_web_love_complex_input.mjs'
      - 'Tools/build-scripts/check_web_love_complex.mjs'
      - 'Tools/build-scripts/stage_web_love_complex_input.mjs'
      - 'Tools/build-scripts/check_web_love_player_output.mjs'
      - 'Tools/build-scripts/check_web_package.mjs'
      - 'Tools/build-scripts/check_web_preview.mjs'
      - 'Tools/build-scripts/package_web_game.mjs'
      - 'Tools/build-scripts/package_web_preview.mjs'
      - 'Tools/build-scripts/rollback_web_preview.mjs'
      - 'Tools/tolua\+\+/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  build-web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: wasm32-unknown-emscripten
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Setup CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install 'cmake==3.30.5'
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"
      - name: Build Web packages
        run: Tools/build-scripts/build_web.sh
      - name: Verify Web package
        run: node Tools/build-scripts/check_web_output.mjs result/dora-web-build-probe
      - name: Verify Web Player package
        run: |
          node Tools/build-scripts/check_web_loader.mjs
          node Tools/build-scripts/check_web_love_capabilities.mjs
          node Tools/build-scripts/check_web_package.mjs
          node Tools/build-scripts/check_web_player_output.mjs result/dora-web-player
          node Tools/build-scripts/check_web_forbidden_deps.mjs result/dora-web-player
      - name: Package deployable Web Player preview
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        run: |
          node Tools/build-scripts/check_web_preview.mjs result/dora-web-player
          node Tools/build-scripts/package_web_preview.mjs result/dora-web-player result/dora-web-preview "$GITHUB_SHA"
      - name: Upload Web package
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-build-probe
          path: result/dora-web-build-probe
      - name: Upload Web Player package
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-player
          path: result/dora-web-player
      - name: Upload deployable Web Player preview
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-preview
          path: result/dora-web-preview
  build-love-pthread-player:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: wasm32-unknown-emscripten
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Setup CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install 'cmake==3.30.5'
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"
      - name: Build Love pthread Player
        env:
          DORA_WEB_PTHREADS: 1
        run: Tools/build-scripts/build_web.sh
      - name: Verify Love pthread Player
        run: node Tools/build-scripts/check_web_love_player_output.mjs result/love-pthread-player
      - name: Upload Love pthread Player
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: love-pthread-player
          path: result/love-pthread-player
