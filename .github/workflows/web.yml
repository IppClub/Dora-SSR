name: Web

on:
  push:
    branches: [ main ]
    paths:
      - 'Projects/CMake/**'
      - 'Projects/Web/**'
      - 'Source/**'
      - 'Tools/build-scripts/build_web.sh'
      - 'Tools/build-scripts/check_web_build_env.sh'
      - 'Tools/build-scripts/check_web_browser.mjs'
      - 'Tools/build-scripts/check_web_output.mjs'
      - 'Tools/build-scripts/check_web_player_output.mjs'
      - 'Tools/build-scripts/check_web_forbidden_deps.mjs'
      - 'Tools/build-scripts/check_web_loader.mjs'
      - 'Tools/build-scripts/check_web_love_capabilities.mjs'
      - 'Tools/build-scripts/check_web_love_complex_input.mjs'
      - 'Tools/build-scripts/check_web_love_complex.mjs'
      - 'Tools/build-scripts/stage_web_love_complex_input.mjs'
      - 'Tools/build-scripts/check_web_love_graphics.mjs'
      - 'Tools/build-scripts/check_web_love_shader.mjs'
      - 'Tools/build-scripts/check_web_love_audio.mjs'
      - 'Tools/build-scripts/check_web_love_runtime.mjs'
      - 'Tools/build-scripts/check_web_package.mjs'
      - 'Tools/build-scripts/check_web_performance.mjs'
      - 'Tools/build-scripts/check_web_preview.mjs'
      - 'Tools/build-scripts/package_web_game.mjs'
      - 'Tools/build-scripts/package_web_preview.mjs'
      - 'Tools/build-scripts/rollback_web_preview.mjs'
      - 'Tools/tolua\+\+/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Projects/CMake/**'
      - 'Projects/Web/**'
      - 'Source/**'
      - 'Tools/build-scripts/build_web.sh'
      - 'Tools/build-scripts/check_web_build_env.sh'
      - 'Tools/build-scripts/check_web_browser.mjs'
      - 'Tools/build-scripts/check_web_output.mjs'
      - 'Tools/build-scripts/check_web_player_output.mjs'
      - 'Tools/build-scripts/check_web_forbidden_deps.mjs'
      - 'Tools/build-scripts/check_web_loader.mjs'
      - 'Tools/build-scripts/check_web_love_capabilities.mjs'
      - 'Tools/build-scripts/check_web_love_complex_input.mjs'
      - 'Tools/build-scripts/check_web_love_complex.mjs'
      - 'Tools/build-scripts/stage_web_love_complex_input.mjs'
      - 'Tools/build-scripts/check_web_love_graphics.mjs'
      - 'Tools/build-scripts/check_web_love_shader.mjs'
      - 'Tools/build-scripts/check_web_love_audio.mjs'
      - 'Tools/build-scripts/check_web_love_runtime.mjs'
      - 'Tools/build-scripts/check_web_package.mjs'
      - 'Tools/build-scripts/check_web_performance.mjs'
      - 'Tools/build-scripts/check_web_preview.mjs'
      - 'Tools/build-scripts/package_web_game.mjs'
      - 'Tools/build-scripts/package_web_preview.mjs'
      - 'Tools/build-scripts/rollback_web_preview.mjs'
      - 'Tools/tolua\+\+/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Web Player soak duration in seconds
        required: true
        default: 1800
        type: number

jobs:
  build-web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: wasm32-unknown-emscripten
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Setup CMake
        run: |
          python3 -m pip install --user 'cmake==3.30.5'
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - name: Build Web packages
        run: Tools/build-scripts/build_web.sh
      - name: Verify Web package
        run: node Tools/build-scripts/check_web_output.mjs result/dora-web-build-probe
      - name: Verify Web Player package
        run: |
          node Tools/build-scripts/check_web_loader.mjs
          node Tools/build-scripts/check_web_love_capabilities.mjs
          node Tools/build-scripts/check_web_package.mjs
          node Tools/build-scripts/check_web_player_output.mjs result/dora-web-player
          node Tools/build-scripts/check_web_forbidden_deps.mjs result/dora-web-player
      - name: Run Web Player browser smoke
        if: runner.os == 'Linux'
        env:
          DORA_WEB_RELOADS: 20
          DORA_WEB_SOAK_SECONDS: ${{ inputs.soak_seconds || 0 }}
        run: node Tools/build-scripts/check_web_browser.mjs result/dora-web-player
      - name: Run Love Web runtime browser fixture
        if: runner.os == 'Linux'
        env:
          DORA_WEB_LOVE_RELOADS: 20
        run: node Tools/build-scripts/check_web_love_runtime.mjs build/web
      - name: Run Love Web graphics browser fixture
        if: runner.os == 'Linux'
        env:
          DORA_WEB_LOVE_GRAPHICS_RELOADS: 20
        run: node Tools/build-scripts/check_web_love_graphics.mjs build/web
      - name: Run Love Web shader browser fixture
        if: runner.os == 'Linux'
        env:
          DORA_WEB_LOVE_SHADER_RELOADS: 20
        run: node Tools/build-scripts/check_web_love_shader.mjs build/web
      - name: Run Love Web audio lifecycle fixture
        if: runner.os == 'Linux'
        env:
          DORA_WEB_LOVE_AUDIO_RELOADS: 20
          DORA_WEB_LOVE_AUDIO_SOAK_SECONDS: ${{ inputs.soak_seconds || 0 }}
        run: node Tools/build-scripts/check_web_love_audio.mjs build/web
      - name: Check Web Player performance trend
        if: runner.os == 'Linux'
        run: node Tools/build-scripts/check_web_performance.mjs
      - name: Package deployable Web Player preview
        if: runner.os == 'Linux'
        run: |
          node Tools/build-scripts/check_web_preview.mjs result/dora-web-player
          node Tools/build-scripts/package_web_preview.mjs result/dora-web-player result/dora-web-preview "$GITHUB_SHA"
      - name: Upload Web package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-build-probe
          path: result/dora-web-build-probe
      - name: Upload Web Player package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-player
          path: result/dora-web-player
      - name: Upload deployable Web Player preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-preview
          path: result/dora-web-preview
      - name: Upload Web Player browser smoke
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dora-web-browser-smoke
          path: |
            build/web-browser-smoke.png
            build/web-browser-smoke-dpr2.png
            build/web-render-target-readback.png
            build/web-advanced-texture-capabilities.json
            build/web-startup-performance.json
            build/web-performance-trend.json
            build/web-soak-report.json
            build/web-love-runtime-report.json
            build/web-love-graphics-report.json
            build/web-love-graphics.png
            build/web-love-shader-report.json
            build/web-love-shader.png
            build/web-love-audio-report.json
          if-no-files-found: ignore
