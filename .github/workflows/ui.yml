name: UI CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Tools/dora-dora/**'
      - 'Studio/packages/agent-ui/**'
      - 'Studio/packages/compiler/**'
      - 'Studio/packages/tstl/**'
      - 'Projects/Web/**'
      - 'Source/**'
      - 'Tools/build-scripts/build_web.sh'
      - 'Tools/build-scripts/check_web_build_env.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'Tools/dora-dora/**'
      - 'Studio/packages/agent-ui/**'
      - 'Studio/packages/compiler/**'
      - 'Studio/packages/tstl/**'
      - 'Projects/Web/**'
      - 'Source/**'
      - 'Tools/build-scripts/build_web.sh'
      - 'Tools/build-scripts/check_web_build_env.sh'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools/dora-dora
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'Tools/dora-dora/package.json'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
          cache-dependency-path: 'Tools/dora-dora/pnpm-lock.yaml'

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.5
          actions-cache-folder: emsdk-cache

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: Setup CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install 'cmake==3.30.5'
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        # oxlint exits 0 for warnings, 1 for errors — only errors block the build
        run: pnpm lint

      - name: Test Web runtime preparation
        run: pnpm test:web-runtime-preparation

      - name: Build (Vite)
        run: pnpm build

      - name: Verify Web export assets
        run: |
          pnpm test:web-package
          pnpm verify:web-release-assets
