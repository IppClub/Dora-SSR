<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Dora SSR: engine on device, development in browser</title>
  <desc id="desc">Run the Dora engine on a target device, connect its browser Web IDE over the local network, and build with cross-platform 2D and 3D, multi-language scripting, and instant preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--canvas-start)"/><stop offset="1" stop-color="var(--canvas-end)"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--card-start)"/><stop offset="1" stop-color="var(--card-end)"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7b733"/><stop offset="1" stop-color="#ffd86b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dy="8" stdDeviation="10" flood-color="var(--shadow)" flood-opacity=".24"/></filter>
    <style>
      :root {
        --canvas-start: #fffaf0; --canvas-end: #f5f1e8;
        --card-start: #ffffff; --card-end: #fbf7ee; --border: #e6d5ad;
        --text: #252525; --text-soft: #5d5d60;
        --accent: #e1ad03; --accent-text: #936b00; --accent-pale: #fff0c2;
        --network: #fff7dc; --chip: #fffdf8; --shadow: #8f7b4b;
        --device: #27272a; --device-screen: #35353a; --device-border: #77777d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas-start: #202021; --canvas-end: #181819;
          --card-start: #2b2b2d; --card-end: #242426; --border: #514832;
          --text: #f3f3f4; --text-soft: #d0d0d2;
          --accent: #fac03d; --accent-text: #ffd66b; --accent-pale: #3b321e;
          --network: #2b2518; --chip: #28282a; --shadow: #000000;
          --device: #151516; --device-screen: #242426; --device-border: #6f6f74;
        }
      }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .headline { font-size: 25px; font-weight: 760; fill: var(--text); }
      .eyebrow { font-size: 11px; font-weight: 750; letter-spacing: 1.3px; }
      .card-title { font-size: 20px; font-weight: 740; fill: var(--text); }
      .feature { font-size: 13px; font-weight: 680; fill: var(--text-soft); }
    </style>
  </defs>

  <rect x="8" y="8" width="944" height="334" rx="30" fill="url(#bg)"/>
  <path d="M734 8h188a30 30 0 0 1 30 30v154c-82-16-151-57-190-111-18-25-28-50-28-73Z" fill="var(--accent)" opacity=".06"/>
  <circle cx="884" cy="66" r="54" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".14"/><circle cx="884" cy="66" r="33" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".14"/>

  <g transform="translate(46 31)">
    <rect width="99" height="25" rx="12.5" fill="var(--accent-pale)"/><circle cx="15" cy="12.5" r="4" fill="var(--accent)"/>
    <text x="26" y="17" class="eyebrow" fill="var(--accent-text)">DORA SSR</text>
    <text y="59" class="headline">Engine on device. Development in browser.</text>
  </g>

  <g filter="url(#shadow)"><rect x="46" y="112" width="276" height="144" rx="22" fill="url(#card)" stroke="var(--border)"/><rect x="638" y="112" width="276" height="144" rx="22" fill="url(#card)" stroke="var(--border)"/></g>
  <path d="M333 184H627" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <g transform="translate(72 131)">
    <rect width="66" height="106" rx="15" fill="var(--device)" stroke="var(--device-border)" stroke-width="2"/><rect x="7" y="9" width="52" height="79" rx="9" fill="var(--device-screen)"/>
    <image href="data:image/svg+xml;base64," x="10" y="18" width="46" height="47" preserveAspectRatio="xMidYMid meet"/><circle cx="33" cy="97" r="3" fill="#70819c"/>
  </g>
  <g transform="translate(162 158)">
    <text class="eyebrow" fill="var(--accent-text)">DORA ENGINE</text><text y="35" class="card-title">Run on target</text>
    <rect y="55" width="120" height="25" rx="12.5" fill="var(--accent-pale)"/><text x="60" y="72" text-anchor="middle" font-size="11" font-weight="650" fill="var(--accent-text)">TARGET DEVICE</text>
  </g>

  <circle cx="480" cy="184" r="54" fill="var(--network)" stroke="var(--accent)"/>
  <path d="M452 177c16-17 40-17 56 0M462 188c10-11 26-11 36 0M473 199c4-4 10-4 14 0" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/><circle cx="480" cy="207" r="3.5" fill="var(--accent)"/>
  <rect x="406" y="222" width="148" height="23" rx="11.5" fill="var(--accent-pale)"/><text x="480" y="238" text-anchor="middle" class="eyebrow" fill="var(--accent-text)">LOCAL NETWORK</text>

  <g transform="translate(662 134)">
    <rect width="84" height="80" rx="10" fill="#f8fafc"/><path d="M0 10A10 10 0 0 1 10 0h64a10 10 0 0 1 10 10v9H0Z" fill="#dce4ef"/>
    <circle cx="10" cy="10" r="3" fill="#ff6b6b"/><circle cx="19" cy="10" r="3" fill="#f7b733"/><circle cx="28" cy="10" r="3" fill="#4ade80"/>
    <rect x="9" y="29" width="21" height="41" rx="4" fill="#ececec"/><rect x="38" y="30" width="33" height="4" rx="2" fill="#77777d"/><rect x="38" y="40" width="25" height="4" rx="2" fill="#fac03d"/><rect x="38" y="50" width="30" height="4" rx="2" fill="#c8a64b"/><rect x="38" y="60" width="20" height="4" rx="2" fill="#929298"/><path d="M27 80h30l6 8H21Z" fill="#77777d"/>
  </g>
  <g transform="translate(760 158)">
    <text class="eyebrow" fill="var(--accent-text)">WEB IDE</text><text y="35" class="card-title" style="font-size:18px">Build in browser</text>
    <rect y="55" width="105" height="25" rx="12.5" fill="var(--accent-pale)"/><text x="13" y="72" font-size="11" font-weight="650" fill="var(--accent-text)">FULL TOOLSET</text>
  </g>

  <g transform="translate(46 278)">
    <rect width="276" height="44" rx="15" fill="var(--chip)" stroke="var(--border)"/><circle cx="25" cy="22" r="12" fill="var(--accent-pale)"/>
    <path d="M19 18h12M19 22h12M22 15c-4 5-4 10 0 14M28 15c4 5 4 10 0 14" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/><text x="45" y="27" class="feature">Cross-platform 2D / 3D</text>
  </g>
  <g transform="translate(342 278)">
    <rect width="276" height="44" rx="15" fill="var(--chip)" stroke="var(--border)"/><circle cx="25" cy="22" r="12" fill="var(--accent-pale)"/>
    <path d="m22 16-5 6 5 6M29 16l5 6-5 6" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="27" class="feature">Multi-language scripting</text>
  </g>
  <g transform="translate(638 278)">
    <rect width="276" height="44" rx="15" fill="var(--chip)" stroke="var(--border)"/><circle cx="25" cy="22" r="12" fill="var(--accent-pale)"/>
    <path d="M25 14a8 8 0 1 0 7 4M25 14v7h7" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="27" class="feature">Instant run &amp; preview</text>
  </g>
</svg>
