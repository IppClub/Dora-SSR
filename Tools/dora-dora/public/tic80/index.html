<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TIC-80 tiny computer</title>

    <style type="text/css">
        .modal{display:none;position:fixed;z-index:1;padding-top:100px;left:0;top:0;width:100%;height:100%;overflow:auto;background-color:#000;background-color:rgba(0,0,0,.4)}
        .modal-content{color: #333c57;position:relative;background-color:#fefefe;margin:auto;padding:2px 16px;border:1px solid #888;width:500px;box-shadow:0 4px 8px 0 rgba(0,0,0,.2),0 6px 20px 0 rgba(0,0,0,.19);-webkit-animation-name:animatetop;-webkit-animation-duration:.4s;animation-name:animatetop;animation-duration:.4s}@keyframes animatetop{from{top:-300px;opacity:0}to{top:0;opacity:1}}
        .close{color:#000;float:right;font-size:28px;font-weight:700}
        .close:focus,
        .close:hover{color:#000;text-decoration:none;cursor:pointer}

        #game-frame > div { font-size: 44px; font-family: monospace; font-weight: bold;}

        /* You can set custom dimensions here */
        .game { width: 100vw; height: 100vh; }
        #canvas { outline: none; }
    </style>
</head>
<body style="margin:0; padding:0;">

    <div class="game" style="margin: 0; position: relative; background: #1a1c2c;">
        <canvas style="width: 100%; height: 100%; margin: 0 auto; display: block; image-rendering: pixelated;" id="canvas" oncontextmenu="event.preventDefault()" onmousedown="window.focus()" tabindex="0"></canvas>
    </div>

    <div id="add-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times</span>
            <p>Select a file to add to the computer</p>
            <p><input type="file" id="upload-input"></input></p>
        </div>
    </div>

    <script type="text/javascript">
        var cartPath = '/dora-ide/cart.tic';
        var runtimePrepared = false;
        var initializingCart = false;
        var bridgeHooked = false;
        var Module = {
            canvas: document.getElementById('canvas'),
            // Use a private MEMFS directory. Studio's persistent cache must never
            // replace the cartridge supplied by the project being opened.
            arguments: ['--skip', '--fs=/dora-ide', '--cmd=load cart.tic & edit'],
            preRun: [function() {
                hookModuleMethods();
                addRunDependency('dora-cartridge');
                runtimePrepared = true;
                initializeCartridge();
            }]
        };
        var tic80FilePath = null;
        var importingCart = false;
        var cartImported = false;
        var loadReported = false;

        function postToEditor(data) {
            window.parent.postMessage(data, window.location.origin);
        }

        function initializeCartridge() {
            if (!runtimePrepared || !tic80FilePath || initializingCart) return;
            initializingCart = true;
            requestReadFile().then(function(rom) {
                if (!rom || !rom.length) return; // Keep Studio blocked on a failed load.
                importingCart = true;
                try {
                    FS.mkdirTree('/dora-ide');
                    FS.writeFile(cartPath, rom);
                    cartImported = true;
                } finally {
                    importingCart = false;
                }
                removeRunDependency('dora-cartridge');
            }).catch(function(error) {
                console.error('Error initializing TIC-80 cartridge:', error);
                postToEditor({type: 'TIC80_LOAD_FAILED'});
            });
        }

        window.addEventListener('message', function(event) {
            if (event.source !== window.parent || event.origin !== window.location.origin) return;
            switch (event.data && event.data.type) {
                case 'TIC80_INIT':
                    tic80FilePath = event.data.filePath;
                    initializeCartridge();
                    break;
                case 'TIC80_READ_FILE_RESPONSE':
                    if (window.tic80FileReadCallback) {
                        var callback = window.tic80FileReadCallback;
                        window.tic80FileReadCallback = null;
                        callback(event.data.success ? event.data.rom : null);
                    }
                    break;
            }
        });

        function requestReadFile() {
            return new Promise(function(resolve) {
                window.tic80FileReadCallback = resolve;
                postToEditor({type: 'TIC80_READ_FILE'});
            });
        }

        function requestWriteFile(blob, filename) {
            postToEditor({type: 'TIC80_WRITE_FILE', rom: blob, filename: filename});
        }

        function hookModuleMethods() {
            if (bridgeHooked) return;
            if (!Module || typeof Module.saveAs !== 'function' || typeof FS === 'undefined') return;
            bridgeHooked = true;
            var originalSaveAs = Module.saveAs;
            Module.saveAs = function(blob, filename) {
                if (!tic80FilePath) return originalSaveAs.call(Module, blob, filename);
                requestWriteFile(blob, filename);
            };

            // Ctrl+S saves the loaded cartridge through Studio's virtual FS.
            // Mirror that completed binary write to the original project path.
            var originalClose = FS.close;
            FS.close = function(stream) {
                var path = stream.path;
                var writing = (stream.flags & 3) !== 0;
                var result = originalClose.call(FS, stream);
                if (cartImported && !importingCart && path === cartPath) {
                    if (!writing && !loadReported) {
                        loadReported = true;
                        setTimeout(function() { postToEditor({type: 'TIC80_LOADED'}); }, 0);
                    }
                    if (writing) {
                        try {
                            requestWriteFile(new Blob([FS.readFile(path)], {type: 'application/octet-stream'}), 'cart.tic');
                        } catch (error) {
                            console.error('Error exporting saved TIC-80 cartridge:', error);
                            requestWriteFile(null, 'cart.tic');
                        }
                    }
                }
                return result;
            };
        }

        // Safari/WebKit-only: remap Arrow keys with location 3 (numpad) to location 0.
        (function(){
            const ua = navigator.userAgent || '';
            const isWebKit = /AppleWebKit/i.test(ua);
            if (!isWebKit) return;

            const synthesizeArrowWithLocation0 = (orig) => {
                try {
                    const ev = new KeyboardEvent(orig.type, {
                        key: orig.key,
                        code: orig.code,
                        location: 0,
                        repeat: orig.repeat,
                        ctrlKey: orig.ctrlKey,
                        shiftKey: orig.shiftKey,
                        altKey: orig.altKey,
                        metaKey: orig.metaKey,
                        bubbles: true,
                        cancelable: true,
                    });
                    Object.defineProperty(ev, 'which', { get: () => orig.which });
                    Object.defineProperty(ev, 'keyCode', { get: () => orig.keyCode });
                    return ev;
                } catch { return null; }
            };

            const remapArrowLocationCapture = (e) => {
                const isArrow = (e.key && e.key.startsWith('Arrow')) || (e.code && e.code.startsWith('Arrow'));
                if (!isArrow) return;
                if (e.location === 3) {
                    const syn = synthesizeArrowWithLocation0(e);
                    if (syn) {
                        e.stopImmediatePropagation();
                        e.preventDefault();
                        (e.target || document.getElementById('canvas')).dispatchEvent(syn);
                    }
                }
            };

            ['keydown','keyup'].forEach(t => document.addEventListener(t, remapArrowLocationCapture, true));
        })();

        // Prevent page scrolling while the game canvas is focused
        (function(){
            const canvasEl = document.getElementById('canvas');
            const preventArrowDefault = (e) => {
                const key = e.key || e.code;
                const kc = e.keyCode || e.which;
                const isArrow = (key && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) || (kc >= 37 && kc <= 40);
                if (isArrow && document.activeElement === canvasEl) e.preventDefault();
            };
            document.addEventListener('keydown', preventArrowDefault, { passive: false });
            canvasEl.addEventListener('keydown', preventArrowDefault, { passive: false });
        })();

        let scriptTag = document.createElement('script'), // create a script tag
        firstScriptTag = document.getElementsByTagName('script')[0]; // find the first script tag in the document
        scriptTag.src = 'tic80.js'; // set the source of the script to your script
        scriptTag.onload = function() {
            hookModuleMethods();
        };
        firstScriptTag.parentNode.insertBefore(scriptTag, firstScriptTag); // append the script to the DOM
        // Focus canvas to ensure keyboard events are routed to the game
        document.getElementById('canvas').focus()
    </script>
</body>
</html>
