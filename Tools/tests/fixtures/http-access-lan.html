<!doctype html>
<meta charset="utf-8">
<title>HTTP LAN development acceptance</title>
<style>body{font:18px system-ui;margin:3em;line-height:1.6}pre{white-space:pre-wrap}</style>
<h1>HTTP LAN / Vite / compiler acceptance</h1>
<pre id="result">Running…</pre>
<script type="module">
import {getSync,createAuthHeaders,signAuthPayload,authNonce} from '/client-auth.js';
const result=document.querySelector('#result'),lines=[];
const session={sessionId:'qa-session',sessionSecret:'qa-secret'};
const key='doraWebAuthSession',previous=localStorage.getItem(key);
const pass=text=>{lines.push('PASS '+text);result.textContent=lines.join('\n');};
async function request(target,auth,want,method='POST') {
 const url=new URL(target,location.href);
 const body=method==='POST'?'{}':undefined;
 const headers=auth?createAuthHeaders(session,method,url,new TextEncoder().encode(body??''),true):{'Content-Type':'application/json'};
 const res=await fetch(url,{method,headers,body});
 if(res.status!==want)throw new Error(`${target}: expected ${want}, got ${res.status}`);
 pass(`${method} ${target} ${auth?'signed':'unsigned'} → ${want}`);
}
try {
 if(crypto.subtle)throw new Error('Use the machine LAN IP over HTTP to test an insecure context');
 pass('HTTP LAN has no crypto.subtle');
 localStorage.setItem(key,JSON.stringify(session));
 await request('/__dora/api/ping',false,401);
 await request('/__dora/api/ping',true,200);
 const read=getSync('/read-sync',new URLSearchParams({path:'a b.ts'}));
 if(!read?.success)throw new Error('Synchronous compiler read failed');
 pass('production synchronous compiler XHR authenticates through Vite');
 await request('/__dora/api/test.txt',true,200,'GET');
 await request(`http://${location.hostname}:8866/ping`,false,401);
 await request(`http://${location.hostname}:8866/ping`,true,200);
 const ts=String(Math.floor(Date.now()/1000)),nonce=authNonce();
 const query=new URLSearchParams({nonce,session:session.sessionId,ts}).toString();
 const sig=signAuthPayload(session.sessionSecret,[session.sessionId,'GET','/?'+query,ts,nonce,''].join('\n'));
 await new Promise((resolve,reject)=>{
  const socket=new WebSocket(`ws://${location.host}/__dora/ws?${query}&sig=${sig}`);
  const timer=setTimeout(()=>{socket.close();reject(new Error('WS timeout'));},5000);
  socket.onopen=()=>{clearTimeout(timer);socket.close();resolve();};
  socket.onerror=()=>{clearTimeout(timer);reject(new Error('Signed LAN WS failed'));};
 });
 pass('signed Vite WebSocket without crypto.subtle');
 result.textContent+='\nALL PASSED';
} catch(error) {result.textContent+='\nFAIL '+error.stack;}
finally {if(previous===null)localStorage.removeItem(key);else localStorage.setItem(key,previous);}
</script>
