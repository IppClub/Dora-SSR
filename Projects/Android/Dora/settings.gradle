// Godot 4.7.2's Java AAR includes Kotlin 2.1 metadata. Use a compatible
// Lint for the default production component. AGP 8.6.1 already bundles a
// compatible R8; overriding it with the older workaround would downgrade R8.
// https://developer.android.com/build/kotlin-support
pluginManagement {
    if (settings.providers.gradleProperty('dora.godot').orElse('true').get().toBoolean()) {
        if (!System.getProperty('android.lint.version')) System.setProperty('android.lint.version', '8.9.3')
    }
}
include ':app'
