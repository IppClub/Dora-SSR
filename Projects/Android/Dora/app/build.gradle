apply plugin: 'com.android.application'

// Godot is part of production APKs. -Pdora.godot=false is an explicit slim build.
def godotEnabled = (project.findProperty('dora.godot') ?: 'true').toString().toBoolean()
def doraAbis = (project.findProperty('dora.android.abis') ?: 'armeabi-v7a,arm64-v8a,x86_64')
    .toString().split(',').collect { it.trim() }
if (doraAbis.isEmpty() || !doraAbis.every { it in ['armeabi-v7a', 'arm64-v8a', 'x86_64'] }) {
    throw new GradleException('dora.android.abis must contain supported Dora Android ABIs')
}
def godotArch = ['arm64-v8a': 'arm64', 'armeabi-v7a': 'arm32', 'x86_64': 'x86_64']
def godotTest = (project.findProperty('dora.godot.test') ?: 'false').toString().toBoolean()
if (godotTest && !godotEnabled) throw new GradleException('Godot tests require -Pdora.godot=true')
if (godotTest || project.findProperty('dora.godot.buildDir')) buildDir = rootProject.file(project.findProperty('dora.godot.buildDir') ?: '../../../build/godot-android/gradle-app')
def godotJava = rootProject.file(project.findProperty('dora.godot.javaAar') ?: '../../../build/godot-android/java/godot-java-4.7.2.stable.aar')
def godotRuntimeOverride = project.findProperty('dora.godot.runtimePackage')
def godotRuntimePackages = godotRuntimeOverride ? [rootProject.file(godotRuntimeOverride)] : doraAbis.collect {
    rootProject.file("../../../build/godot-component/android/${godotArch[it]}/release/package")
}
def godotRuntimePackage = godotRuntimePackages.first()
// Keep source assets intact when packaging a standalone Godot-enabled game.
def godotAssets = rootProject.file(godotEnabled && project.findProperty('dora.godot.assets')
    ? project.findProperty('dora.godot.assets')
    : (godotTest ? '../../../build/godot-android/test-assets' : '../../../Assets'))
if (!godotAssets.isDirectory()) throw new GradleException('Dora asset directory does not exist: ' + godotAssets)

def godotNoticeAssets = new File(buildDir, 'generated/godot-notice-assets')
def readGodotNotices = {
    def manifestFile = new File(godotRuntimePackage, 'manifest.json')
    if (!manifestFile.isFile()) throw new GradleException('Missing Godot runtime manifest: ' + manifestFile)
    def metadata = new groovy.json.JsonSlurper().parse(manifestFile)
    if (!(metadata.licenses instanceof List) || metadata.licenses.isEmpty()) {
        throw new GradleException('Godot runtime manifest must declare its licenses')
    }
    metadata.licenses.collect { relative ->
        if (!(relative instanceof String) || relative.isEmpty() || relative.startsWith('/') || relative.contains('\\') || relative.tokenize('/').contains('..')) {
            throw new GradleException('Invalid Godot license path')
        }
        def file = new File(godotRuntimePackage, relative)
        if (!file.canonicalPath.startsWith(godotRuntimePackage.canonicalPath + File.separator) || !file.isFile()) {
            throw new GradleException('Godot license is missing or outside the runtime package: ' + relative)
        }
        [relative: relative, file: file, sha256: metadata.artifacts[relative]]
    }
}
def prepareGodotNotices = godotEnabled ? tasks.register('prepareGodotNotices') {
    dependsOn 'prepareProductionGodot'
    inputs.files(godotRuntimePackages.collect { new File(it, 'manifest.json') })
    inputs.files(provider { new File(godotRuntimePackage, 'manifest.json').isFile() ? readGodotNotices().collect { it.file } : [] })
    outputs.dir(godotNoticeAssets)
    doLast {
        def notices = readGodotNotices()
        notices.each { notice ->
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(notice.file.bytes).encodeHex().toString()
            if (actual != notice.sha256) throw new GradleException('Godot license checksum mismatch: ' + notice.relative)
        }
        delete godotNoticeAssets
        notices.each { notice ->
            def target = new File(godotNoticeAssets, 'GodotRuntimeNotices/' + notice.relative)
            target.parentFile.mkdirs()
            target.bytes = notice.file.bytes
        }
        godotRuntimePackages.eachWithIndex { runtime, i ->
            def manifest = new File(godotNoticeAssets, "GodotRuntimeNotices/${i}/manifest.json")
            manifest.parentFile.mkdirs()
            // This sealed receipt describes build inputs. AGP strips native debug
            // symbols later, so final APK libc++ hashes differ from this receipt.
            manifest.bytes = new File(runtime, 'manifest.json').bytes
        }
    }
} : null

def waArtifact = rootProject.file('app/build/xmake-aar/wa.aar')
// Gradle workers do not limit Ninja's per-ABI compile concurrency.
def nativeJobs = project.findProperty('dora.android.jobs')?.toString()
if (nativeJobs != null && !(nativeJobs ==~ /([1-9]|[12][0-9]|3[0-2])/)) {
    throw new GradleException('dora.android.jobs must be an integer from 1 to 32')
}


// Studio launched from Finder may not inherit Homebrew's PATH. Explicit
// overrides also support Windows/Linux and CI without a machine-specific path.
def xmakeExecutable = project.findProperty('dora.xmake') ?: System.getenv('DORA_XMAKE')
if (!xmakeExecutable) {
	def names = System.getProperty('os.name').startsWith('Windows') ? ['xmake.exe'] : ['xmake']
	def directories = (System.getenv('PATH') ?: '').split(File.pathSeparator).toList()
	directories.addAll(['/opt/homebrew/bin', '/usr/local/bin'])
	xmakeExecutable = directories.collectMany { directory -> names.collect { new File(directory, it) } }
		.find { it.isFile() }?.absolutePath
}
if (!xmakeExecutable || !new File(xmakeExecutable.toString()).isFile()) {
	throw new GradleException('Install xmake or set DORA_XMAKE / -Pdora.xmake to its executable path')
}
def doraNdkVersion = godotEnabled ? '29.0.14206865' : '26.1.10909125'
def prepareXmakeAndroid = tasks.register('prepareXmakeAndroid', Exec) {
	workingDir rootProject.file('../../..')
	commandLine xmakeExecutable, 'android-prepare', '-P', rootProject.file('../../..').absolutePath, "--sdk=${android.sdkDirectory}", "--ndk-version=${doraNdkVersion}"
}

android {
	compileSdk (godotEnabled ? 36 : 34)
	buildToolsVersion = (godotEnabled ? '36.1.0' : '34.0.0')
	defaultConfig {
		applicationId (godotTest ? "org.ippclub.dorassr.godotprototype" : "org.ippclub.dorassr")
		minSdkVersion 28
		targetSdkVersion 34
		versionCode 126
		versionName "1.10.2"
		testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
		ndk {
			abiFilters.addAll(doraAbis)
		}
		externalNativeBuild {
			cmake {
				arguments '-DANDROID_STL=c++_shared', "-DDORA_XMAKE=${xmakeExecutable}"
                arguments "-DDORA_GODOT_NODE_TEST=${godotTest ? 'ON' : 'OFF'}"
                if (nativeJobs != null) {
                    arguments "-DCMAKE_JOB_POOLS=dora_compile=${nativeJobs}",
                        '-DCMAKE_JOB_POOL_COMPILE=dora_compile', '-DCMAKE_JOB_POOL_LINK=dora_compile'
                }
				targets 'Dora', 'SDL2'
			}
		}
		javaCompileOptions
	}
	buildTypes {
		release {
			minifyEnabled true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (godotEnabled) proguardFiles 'src/godot/proguard-rules.pro'
            if (godotTest) {
                // Only the isolated prototype ID: run-as collects native GPU
                // evidence from optimized builds. Ordinary releases stay unchanged.
                debuggable true
                signingConfig signingConfigs.debug
            }
		}
	}
	externalNativeBuild {
		cmake {
			path 'CMakeLists.txt'
			version '3.22.1'
		}
	}
	sourceSets {
		main.assets.srcDirs = [godotAssets]
        if (godotEnabled) main.assets.srcDir godotNoticeAssets
        if (godotEnabled) {
            main.java.srcDir 'src/godot/java'
            godotRuntimePackages.each { main.jniLibs.srcDir new File(it, 'jni') }
        }
	}
	packagingOptions {
		jniLibs {
			pickFirsts += ['**/*.so']
            if (godotEnabled) keepDebugSymbols += ['**/libgodot_android.so']
		}
		resources {
			excludes += ['classes.dex']
		}
	}
	compileOptions {
		sourceCompatibility '1.8'
		targetCompatibility '1.8'
	}
	ndkVersion doraNdkVersion
	namespace 'org.ippclub.dorassr'
}

def prepareProductionGodot = godotEnabled ? tasks.register('prepareProductionGodot') {
    doLast {
        def engineRoot = rootProject.file('../../..')
        if (!godotRuntimeOverride) doraAbis.each { abi ->
            project.exec {
                workingDir engineRoot
                environment 'DORA_XMAKE', xmakeExecutable
                commandLine xmakeExecutable, 'lua', new File(engineRoot, 'Tools/Godot/build_component.lua'),
                    '--platform', 'android', '--arch', godotArch[abi], '--mode', 'release',
                    '--sdk', android.sdkDirectory, '--jobs', nativeJobs ?: '2'
            }
        }
        godotRuntimePackages.each { runtime ->
            project.exec {
                workingDir engineRoot
                commandLine xmakeExecutable, 'lua', new File(engineRoot, 'Tools/Godot/verify_package.lua'), runtime
            }
        }
        if (!project.findProperty('dora.godot.javaAar')) project.exec {
            workingDir engineRoot
            commandLine xmakeExecutable, 'lua', new File(engineRoot, 'Tools/Godot/prepare_android_aar.lua'), '--sdk', android.sdkDirectory
        }
    }
} : null

// AGP's Studio model resolves local AARs without executing their builtBy tasks.
// Bootstrap only a missing artifact so a clean checkout can Sync immediately.
// Normal builds still run prepareXmakeAndroid to pick up Go/module changes.
if (!waArtifact.isFile()) {
	logger.lifecycle('Preparing xmake-managed Android Wa runtime for Gradle Sync')
	project.exec {
		workingDir rootProject.file('../../..')
		commandLine xmakeExecutable, 'android-prepare', '-P', rootProject.file('../../..').absolutePath, "--sdk=${android.sdkDirectory}", "--ndk-version=${doraNdkVersion}"
	}
}

dependencies {
    if (godotEnabled) {
        implementation files(godotJava).builtBy(prepareProductionGodot)
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
        implementation 'androidx.fragment:fragment:1.8.6'
        implementation 'androidx.documentfile:documentfile:1.1.0'
    }
	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation files(waArtifact).builtBy(prepareXmakeAndroid)
	androidTestImplementation('androidx.test.ext:junit:1.1.5')
	androidTestImplementation('androidx.test.espresso:espresso-core:3.4.0', {
		exclude group: 'com.android.support', module: 'support-annotations'
	})
	def appcompat_version = "1.6.1"
	implementation "androidx.appcompat:appcompat:$appcompat_version"
	implementation "androidx.appcompat:appcompat-resources:$appcompat_version"
	testImplementation 'junit:junit:4.13.2'
}

tasks.configureEach {
    // Lint models inspect asset source roots before mergeAssets also runs.
    if (godotEnabled && ((name.startsWith('merge') && name.endsWith('Assets')) || name.toLowerCase().contains('lint'))) dependsOn prepareGodotNotices
    if (godotEnabled && name.startsWith('merge') && name.endsWith('NativeLibs')) {
      dependsOn prepareProductionGodot
      doFirst {
        doraAbis.each { abi ->
            if (!godotRuntimePackages.any { new File(it, "jni/${abi}/libgodot_android.so").isFile() }) {
                throw new GradleException("Build/stage the matching Godot Android bridge for ${abi} first")
            }
        }
      }
    }
	if (name == 'preBuild') {
		dependsOn prepareXmakeAndroid
        if (godotEnabled) dependsOn prepareProductionGodot
        if (godotEnabled) doFirst {
            if (!godotJava.isFile()) throw new GradleException('Run xmake lua Tools/Godot/prepare_android_aar.lua first')

        }
	}
}
